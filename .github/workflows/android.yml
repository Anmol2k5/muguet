# Android ARM64 build verification. No game assets or devices needed:
# compiles the Rust runtime, runs source-level checks, assembles the debug
# APK and verifies its contents. Host tool runs that need macOS
# (--precompile-ios, mac .app) are NOT covered here.
name: android

on:
  push:
    branches: [android-port]
  pull_request:
    branches: [android-port]
  workflow_dispatch:

env:
  NDK_VERSION: 27.0.12077973
  NDK_API: 29

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98.1 + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake + Ninja
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Rust check (Android ARM64)
        run: ./scripts/build-android.sh check

      - name: Rust clippy (Android ARM64)
        run: |
          export PATH="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          export CC_aarch64_linux_android="aarch64-linux-android${NDK_API}-clang"
          export CXX_aarch64_linux_android="aarch64-linux-android${NDK_API}-clang++"
          export AR_aarch64_linux_android="llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="aarch64-linux-android${NDK_API}-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,--build-id=sha1"
          export CMAKE_TOOLCHAIN_FILE_aarch64_linux_android="$PWD/scripts/android.toolchain.cmake"
          export CMAKE_GENERATOR=Ninja
          cargo clippy --target aarch64-linux-android --message-format short -- -D warnings

      - name: Compile tests (Android ARM64, no run)
        run: |
          export PATH="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          export CC_aarch64_linux_android="aarch64-linux-android${NDK_API}-clang"
          export CXX_aarch64_linux_android="aarch64-linux-android${NDK_API}-clang++"
          export AR_aarch64_linux_android="llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="aarch64-linux-android${NDK_API}-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,--build-id=sha1"
          export CMAKE_TOOLCHAIN_FILE_aarch64_linux_android="$PWD/scripts/android.toolchain.cmake"
          export CMAKE_GENERATOR=Ninja
          cargo test --target aarch64-linux-android --no-run

      - name: Verify 16 KB page alignment (fresh .so)
        run: |
          export PATH="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          export CC_aarch64_linux_android="aarch64-linux-android${NDK_API}-clang"
          export CXX_aarch64_linux_android="aarch64-linux-android${NDK_API}-clang++"
          export AR_aarch64_linux_android="llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="aarch64-linux-android${NDK_API}-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,--build-id=sha1"
          export CMAKE_TOOLCHAIN_FILE_aarch64_linux_android="$PWD/scripts/android.toolchain.cmake"
          export CMAKE_GENERATOR=Ninja
          cargo build --release --target aarch64-linux-android
          llvm-readelf -l target/aarch64-linux-android/release/libmuguet.so | grep LOAD
          llvm-readelf -l target/aarch64-linux-android/release/libmuguet.so | grep -q "0x4000" || (echo "LOAD segments not 16KB-aligned" && exit 1)

      - name: Assemble debug APK
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libmuguet.so android/app/src/main/jniLibs/arm64-v8a/
          (cd android && ./gradlew :app:assembleDebug :app:lintDebug)

      - name: Verify APK contents
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -q "native-code: 'arm64-v8a'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -q "package: name='dev.muguet.android'"
          unzip -l "$APK" | grep "lib/arm64-v8a/libmuguet.so"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muguet-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
