# Android ARM64 build verification. No game assets or devices needed:
# compiles the Rust runtime, runs source-level checks, assembles the debug
# APK and verifies its contents. Host tool runs that need macOS
# (--precompile-ios, mac .app) are NOT covered here.
#
# SDK setup uses android-actions/setup-android@v4 (v3 requested the obsolete
# `tools` package and fails; v4 skips it with a warning). All other actions
# stay pinned; bump only with reason.
name: android

on:
  push:
    branches: [android-port]
  pull_request:
    branches: [android-port]
  workflow_dispatch:

env:
  NDK_VERSION: 27.0.12077973
  NDK_API: 29

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98.1 + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Export ANDROID_HOME
        run: echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Install platform, build-tools, NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Rust check (Android ARM64)
        run: ./scripts/build-android.sh check

      - name: Rust clippy (Android ARM64)
        run: ./scripts/build-android.sh clippy

      - name: Compile tests (Android ARM64, no run)
        run: ./scripts/build-android.sh test-norun

      - name: Release build + 16 KB alignment check
        run: |
          ./scripts/build-android.sh release
          export PATH="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          llvm-readelf -l target/aarch64-linux-android/release/libmuguet.so | grep LOAD
          llvm-readelf -l target/aarch64-linux-android/release/libmuguet.so | grep -q "0x4000" || (echo "LOAD segments not 16KB-aligned" && exit 1)
          llvm-nm -D --defined-only target/aarch64-linux-android/release/libmuguet.so | grep -q " T android_main" || (echo "android_main missing" && exit 1)

      - name: Assemble debug APK + lint
        run: |
          SO=target/aarch64-linux-android/release/libmuguet.so
          test -f "$SO" || (echo "missing $SO, refusing to package a stale library" && exit 1)
          sha256sum "$SO"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          rm -f android/app/src/main/jniLibs/arm64-v8a/libmuguet.so
          cp "$SO" android/app/src/main/jniLibs/arm64-v8a/
          (cd android && ./gradlew :app:assembleDebug :app:lintDebug)

      - name: Verify APK contents
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || (echo "APK missing" && exit 1)
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -q "package: name='dev.muguet.android'" || (echo "bad package" && exit 1)
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -q "native-code: 'arm64-v8a'" || (echo "bad abi" && exit 1)
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmuguet.so" || (echo "lib missing from APK" && exit 1)
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muguet-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Host-executed regression tests (config layout/tolerance, selftest
  # triggers, fixtures). These run on Linux, NOT on Android: they cover
  # host-testable logic only and never touch a device or game assets.
  # Single-threaded: tests mutate process env (HOME/MUGUET_*) behind a lock,
  # and --test-threads=1 removes any residual cross-test interference.
  test-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc

      - name: Run host tests
        run: cargo test -- --test-threads=1
